name: Host tests

# Track 1 of STRATEGY.md ("Banco di prova"): every push must keep the
# host test suite green, with and without sanitizers.

on:
  push:
  pull_request:

jobs:
  host-tests:
    # Two architectures: x86-64 is TSO and cannot fail on a missing acquire
    # fence in the stream's seqlock reader (ARCHITECTURE.md 3.1.3); arm64 can.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        name: [plain, asan-ubsan]
        include:
          - name: plain
            cflags: ""
          - name: asan-ubsan
            cflags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
    name: host-tests (${{ matrix.name }}, ${{ matrix.os }})
    steps:
      # components/keyer_iambic is the private submodule iu3qez/Esp32KeyerTest.
      # GITHUB_TOKEN cannot read it; a read-only deploy key on that repo can.
      # .gitmodules keeps the https URL so a local clone works with ordinary
      # credentials; only this job rewrites it to ssh.
      - uses: actions/checkout@v4

      - name: Fetch the keyer logic submodule
        env:
          DEPLOY_KEY: ${{ secrets.ESP32KEYERTEST_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git submodule update --init --recursive
          git -C components/keyer_iambic log --oneline -1

      # The keyer logic's interface is frozen (STRATEGY.md, track "Keyer"):
      # the submodule carries a mirror of sample.h for its own host tests,
      # and this is where a silent divergence would be caught.
      - name: Frozen interface still identical
        run: |
          diff <(tail -n +6 components/keyer_iambic/test_host/interface/sample.h) \
               components/keyer_core/include/sample.h

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc

      - name: Configure
        working-directory: test_host
        run: cmake -B build -G Ninja -DCMAKE_C_FLAGS="${{ matrix.cflags }}"

      - name: Build
        working-directory: test_host
        run: cmake --build build

      - name: Run
        working-directory: test_host
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ./build/test_runner

      # The FSM's own suite, at the pinned commit, under this job's flags.
      - name: Configure (keyer logic)
        working-directory: components/keyer_iambic/test_host
        run: cmake -B build -G Ninja -DCMAKE_C_FLAGS="${{ matrix.cflags }}"

      - name: Build (keyer logic)
        working-directory: components/keyer_iambic/test_host
        run: cmake --build build

      - name: Run (keyer logic)
        working-directory: components/keyer_iambic/test_host
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ./build/test_runner

  host-build:
    # cwnetd (host/) links components/keyer_cwnet's server-side core directly
    # by path (host/CMakeLists.txt) and never touches keyer_iambic, so this
    # job needs neither the private submodule nor its deploy key — that is
    # why it is a separate job rather than more steps on host-tests above.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        name: [plain, asan-ubsan]
        include:
          - name: plain
            cflags: ""
          - name: asan-ubsan
            cflags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
    name: host-build (${{ matrix.name }}, ${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      # macOS runners already carry cmake and AppleClang; nothing to install
      # there, and no Ninja anywhere — the default generator builds six files
      # and a brew step is one more thing that can fail on a green tree.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cmake gcc

      # The daemon is the only network-facing program in this repository and
      # the pure core is already sanitized in host-tests; without this leg
      # main.c and sock.c would never see ASan or UBSan anywhere.
      - name: Configure
        working-directory: host
        run: cmake -B build -DCMAKE_C_FLAGS="${{ matrix.cflags }}"

      - name: Build
        working-directory: host
        run: cmake --build build

      - name: Test
        working-directory: host
        run: ctest --test-dir build --output-on-failure
